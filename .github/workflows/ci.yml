name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, spec drift, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      # Build first, and in dependency order. @canopy-io/nestjs resolves
      # @canopy-io/node through its published `types` entry, which only exists
      # once that package has been built — so on a clean checkout every step
      # that reads types fails until this has run. `npm run build --workspaces`
      # is not enough: it runs alphabetically, which would build nestjs first.
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      # Fails when the committed types no longer match the published spec.
      # Skips (exit 0, loudly) when the spec cannot be reached, so a network
      # blip does not read as "the API changed".
      - run: npm run generate:check
      - run: npm run test
      # @canopy-io/node must stay dependency-free: anything that appears there
      # is a supply-chain surface every customer inherits. Framework adapters
      # are exempt — they exist to depend on their framework — so this asserts
      # per package rather than across the workspace, and fails loudly if the
      # package it is meant to guard ever stops being found.
      - name: No runtime dependencies in @canopy-io/node
        run: |
          node - <<'JS'
          const { readFileSync } = require("node:fs");
          const pkg = JSON.parse(readFileSync("packages/node/package.json", "utf8"));
          if (pkg.name !== "@canopy-io/node") {
            console.error(`expected @canopy-io/node at packages/node, found ${pkg.name}`);
            process.exit(1);
          }
          const deps = Object.keys(pkg.dependencies ?? {});
          if (deps.length > 0) {
            console.error(`runtime dependencies present: ${deps.join(", ")}`);
            process.exit(1);
          }
          console.log("confirmed: zero runtime dependencies");
          JS
